<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>runner smoke fixture</title>
<style>
  body { margin: 0; font-family: sans-serif; }
  header, nav { padding: 12px; background: #eee; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; padding: 8px; }
  .card { border: 1px solid #ccc; padding: 8px; }
  .badge { display: inline-block; min-width: 16px; text-align: center; background: #d33; color: #fff; border-radius: 8px; padding: 2px 6px; }
</style>
</head>
<body>
<div id="root" data-testid="app-root">
  <header data-testid="app-header">Smoke Store <span class="badge" data-testid="cart-badge">0</span></header>
  <div data-testid="category-filter"><button>All</button><button>A</button></div>
  <div class="grid" data-testid="product-grid">
    <div class="card" data-testid="product-card">Item 1 <button data-testid="add-to-cart">Add</button></div>
    <div class="card" data-testid="product-card">Item 2 <button data-testid="add-to-cart">Add</button></div>
  </div>
  <nav data-testid="bottom-nav"><a href="#home">Home</a> <a href="#cart">Cart</a></nav>
</div>
<script>
  let n = 0;
  document.querySelectorAll('[data-testid="add-to-cart"]').forEach(btn =>
    btn.addEventListener('click', () => {
      n += 1;
      document.querySelector('[data-testid="cart-badge"]').textContent = String(n);
    }));
</script>
</body>
</html>
