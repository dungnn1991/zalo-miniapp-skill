# agents/openai.yaml — product-specific config cho OpenAI/Codex host, đúng schema hiện hành
# (interface / dependencies / policy). Codex discover và đọc hướng dẫn từ SKILL.md (frontmatter
# name + description); file này CHỈ là metadata UI, không mang instruction — mọi workflow,
# guardrail và exit-code contract nằm ở ../SKILL.md, giống hệt mọi host.
interface:
  display_name: "Create Zalo Mini App"
  short_description: "Dựng và verify demo Zalo Mini App từ prompt + App ID"
  default_prompt: "Use $create-zmp-app to scaffold a Zalo Mini App from a one-line brief plus your Mini App ID."

policy:
  allow_implicit_invocation: true
